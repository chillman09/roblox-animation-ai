<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat animator for Roblox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--mist:#E7EBF1;--panel:#F7F9FB;--ink:#17203A;--muted:#5B6783;--line:#C9D1DE;--accent:#F2542D;--blue:#4C6FFF}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:380px 1fr;background:var(--mist);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif}
aside{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
header{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
h1{font:700 24px/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 10px;letter-spacing:-.01em}
#link{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
#dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
#dot.on{background:#1FA971}
#code{font:600 15px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--ink)}
#log{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.msg.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.msg b{display:block;font-weight:600}
.msg span{color:var(--muted);font-size:13px}
.empty{color:var(--muted);margin:auto 0}
.err{color:#B42318;font-size:13px}
form{padding:14px 20px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
textarea{width:100%;resize:vertical;min-height:84px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:inherit;background:#fff}
textarea:focus,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px}
button,select{font:600 14px "Instrument Sans",sans-serif;padding:9px 14px;border-radius:9px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:#fff}
button.apply{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-rows:1fr auto;min-width:0;min-height:0}
#stage{position:relative;min-height:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{display:flex;gap:12px;align-items:center;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line)}
#scrub{flex:1;accent-color:var(--accent)}
#time{font:500 13px ui-monospace,Menlo,monospace;color:var(--muted);min-width:90px;text-align:right}
.legend{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted)}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto;min-height:100%}aside{order:2;border-right:0}main{order:1;height:55vh}}
</style>
</head>
<body>
<aside>
  <header>
    <h1>Combat animator</h1>
    <div id="link"><i id="dot"></i><span id="linktext">Connecting…</span></div>
  </header>
  <div id="log"><p class="empty">Describe a move, like “heavy overhead sword slash with a big windup”. Pick any result below to replay it.</p></div>
  <form id="form">
    <textarea id="prompt" maxlength="500" placeholder="What should the character do?" required></textarea>
    <div class="row">
      <button class="primary" id="gen" type="submit">Generate</button>
      <button id="rev" type="button" disabled>Revise current</button>
      <button class="apply" id="apply" type="button" disabled>Apply to Studio</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </form>
</aside>
<main>
  <div id="stage"><div class="legend">Orange = right side, blue = left side. Drag to orbit.</div></div>
  <div id="bar">
    <button id="play" type="button" disabled>Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" disabled aria-label="Timeline">
    <select id="speed" aria-label="Speed"><option value="1">1x</option><option value="0.5">0.5x</option><option value="0.25">0.25x</option></select>
    <label><input id="loop" type="checkbox" checked> Loop</label>
    <span id="time">0.00 / 0.00s</span>
  </div>
</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const $ = (s) => document.querySelector(s);

// ---------- 3D preview: R15-shaped skeleton (approximate proportions) ----------
// [name, parent, pivot offset from parent pivot, box size, box centre from pivot, color]
const SKIN = 0xf0c9a0, TORSO = 0x4a5a85, R = 0xf2542d, L = 0x5b7bd5;
const RIG = [
  ["LowerTorso","HumanoidRootPart",[0,0,0],[2,.4,1],[0,0,0],TORSO],
  ["UpperTorso","LowerTorso",[0,.2,0],[2,1.6,1],[0,.8,0],TORSO],
  ["Head","UpperTorso",[0,1.6,0],[1.2,1.2,1.2],[0,.6,0],SKIN],
  ["RightUpperArm","UpperTorso",[1.5,1.4,0],[1,1.2,1],[0,-.5,0],R],
  ["RightLowerArm","RightUpperArm",[0,-1.1,0],[1,1.1,1],[0,-.55,0],R],
  ["RightHand","RightLowerArm",[0,-1.05,0],[.9,.3,.9],[0,-.15,0],SKIN],
  ["LeftUpperArm","UpperTorso",[-1.5,1.4,0],[1,1.2,1],[0,-.5,0],L],
  ["LeftLowerArm","LeftUpperArm",[0,-1.1,0],[1,1.1,1],[0,-.55,0],L],
  ["LeftHand","LeftLowerArm",[0,-1.05,0],[.9,.3,.9],[0,-.15,0],SKIN],
  ["RightUpperLeg","LowerTorso",[.5,-.2,0],[1,1.25,1],[0,-.625,0],R],
  ["RightLowerLeg","RightUpperLeg",[0,-1.25,0],[1,1.25,1],[0,-.625,0],R],
  ["RightFoot","RightLowerLeg",[0,-1.25,0],[1,.3,1.2],[0,-.15,-.1],R],
  ["LeftUpperLeg","LowerTorso",[-.5,-.2,0],[1,1.25,1],[0,-.625,0],L],
  ["LeftLowerLeg","LeftUpperLeg",[0,-1.25,0],[1,1.25,1],[0,-.625,0],L],
  ["LeftFoot","LeftLowerLeg",[0,-1.25,0],[1,.3,1.2],[0,-.15,-.1],L],
];

const stage = $("#stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe5ee);
const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
cam.position.set(5.5, 4.5, -9);
const controls = new OrbitControls(cam, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8896ad, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-4, 9, -6);
scene.add(sun);
scene.add(new THREE.GridHelper(20, 20, 0x9aa6ba, 0xc3ccda));

const bones = {};
const root = new THREE.Group();
root.position.set(0, 3, 0);
scene.add(root);
bones.HumanoidRootPart = root;
for (const [name, parent, off, size, ctr, color] of RIG) {
  const g = new THREE.Group();
  g.position.set(...off);
  bones[parent].add(g);
  bones[name] = g;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), new THREE.MeshStandardMaterial({ color, roughness: 0.7 }));
  mesh.position.set(...ctr);
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({ color: 0x17203a })));
  g.add(mesh);
}
const resize = () => {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
};
new ResizeObserver(resize).observe(stage);
resize();

// ---------- playback ----------
const EASE = { linear: (s) => s, in: (s) => s ** 3, out: (s) => 1 - (1 - s) ** 3, inout: (s) => (s < 0.5 ? 4 * s ** 3 : 1 - (-2 * s + 2) ** 3 / 2) };
function sample(tr, t) {
  if (t <= tr[0].t) return tr[0];
  const last = tr.at(-1);
  if (t >= last.t) return last;
  let i = 1;
  while (tr[i].t < t) i++;
  const a = tr[i - 1], b = tr[i];
  const k = EASE[b.e]((t - a.t) / (b.t - a.t));
  const mix = (x, y) => x.map((v, n) => v + (y[n] - v) * k);
  return { r: mix(a.r, b.r), p: a.p && b.p ? mix(a.p, b.p) : undefined };
}
function pose(t) {
  for (const b of Object.values(bones)) { b.rotation.set(0, 0, 0); }
  bones.LowerTorso.position.set(0, 0, 0);
  if (!anim) return;
  for (const [j, tr] of Object.entries(anim.tracks)) {
    const s = sample(tr, t);
    bones[j].rotation.set(...s.r.map((d) => (d * Math.PI) / 180), "ZYX"); // matches CFrame.Angles order
    if (j === "LowerTorso" && s.p) bones[j].position.set(...s.p);
  }
}

let anim = null, animId = null, t = 0, playing = false, last = performance.now();
const scrub = $("#scrub"), timeEl = $("#time"), playBtn = $("#play");
function setPlaying(v) { playing = v; playBtn.textContent = v ? "Pause" : "Play"; }
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (anim && playing) {
    t += dt * +$("#speed").value;
    if (t >= anim.duration) { if ($("#loop").checked) t = 0; else { t = anim.duration; setPlaying(false); } }
  }
  pose(t);
  if (anim) { scrub.value = (t / anim.duration) * 1000; timeEl.textContent = `${t.toFixed(2)} / ${anim.duration.toFixed(2)}s`; }
  renderer.render(scene, cam);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
playBtn.onclick = () => { if (t >= anim.duration) t = 0; setPlaying(!playing); };
scrub.oninput = () => { setPlaying(false); t = (scrub.value / 1000) * anim.duration; };

function load(id, a) {
  anim = a; animId = id; t = 0;
  for (const el of [playBtn, scrub, $("#rev")]) el.disabled = false;
  $("#apply").disabled = !linked;
  setPlaying(true);
  document.querySelectorAll(".msg").forEach((m) => m.classList.toggle("active", m.dataset.id === id));
}

// ---------- chat + API ----------
const log = $("#log"), err = $("#err");
const items = new Map();
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Request failed (${r.status})`);
  return j;
}
async function generate(revise) {
  const prompt = $("#prompt").value.trim();
  if (prompt.length < 3) return;
  err.textContent = "";
  const btns = [$("#gen"), $("#rev")];
  btns.forEach((b) => (b.disabled = true));
  $("#gen").textContent = "Generating…";
  try {
    const { id, anim: a } = await api("/api/generate", { prompt, previousId: revise ? animId : undefined });
    items.set(id, a);
    log.querySelector(".empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg"; el.dataset.id = id;
    const b = document.createElement("b"); b.textContent = prompt;
    const s = document.createElement("span"); s.textContent = `${a.name}, ${a.duration}s${revise ? ", revision" : ""}`;
    el.append(b, s);
    el.onclick = () => load(id, items.get(id));
    log.append(el);
    log.scrollTop = log.scrollHeight;
    load(id, a);
    $("#prompt").value = "";
  } catch (e) { err.textContent = e.message; }
  $("#gen").disabled = false;
  $("#rev").disabled = !animId;
  $("#gen").textContent = "Generate";
}
$("#form").onsubmit = (e) => { e.preventDefault(); generate(false); };
$("#rev").onclick = () => generate(true);

// ---------- Studio link ----------
let sid = localStorage.getItem("sid"), linked = false;
async function ensureSession() {
  try {
    if (!sid) throw 0;
    await api(`/api/session/${sid}`);
  } catch {
    ({ id: sid } = await api("/api/session", {}));
    localStorage.setItem("sid", sid);
  }
}
async function refreshLink() {
  try {
    const s = await api(`/api/session/${sid}`);
    linked = s.claimed;
    $("#dot").classList.toggle("on", linked);
    const txt = $("#linktext");
    if (linked) txt.textContent = "Studio linked";
    else { txt.textContent = "Enter this code in the Studio plugin: "; const c = document.createElement("span"); c.id = "code"; c.textContent = s.code; txt.append(c); }
    $("#apply").disabled = !(linked && anim);
  } catch { await ensureSession(); }
}
$("#apply").onclick = async () => {
  err.textContent = "";
  try { await api(`/api/session/${sid}/send`, { animId }); $("#apply").textContent = "Sent"; setTimeout(() => ($("#apply").textContent = "Apply to Studio"), 1500); }
  catch (e) { err.textContent = e.message; }
};
await ensureSession();
await refreshLink();
setInterval(refreshLink, 4000);
</script>
</body>
</html>
